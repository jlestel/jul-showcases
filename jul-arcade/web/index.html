<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JuL Arcade · L'aiguilleur</title>
<style>
  @font-face { font-family: "Fredoka"; src: url(/vendor/fredoka-latin.woff2) format("woff2"); font-weight: 300 700; }
  :root {
    --paper:#fffafd; --cream:#fff0f7; --ink:#4a2f6b; --muted:#9a7fb8; --coral:#ff5d8f; --teal:#2fd9a0;
    --butter:#ffd84d; --plum:#a66bff; --rose:#ff8fc8; --sky:#3ec7ff; --line:3px solid var(--ink);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:linear-gradient(#ffd6ec,#d9ccff 55%,#bfe9ff); color:var(--ink); font-family:"Fredoka",system-ui,sans-serif; }
  #gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .sticker { background:var(--paper); border:var(--line); border-radius:22px; box-shadow:5px 6px 0 var(--plum); }
  button { font-family:inherit; color:var(--ink); }

  /* top bar */
  #top { position:fixed; top:14px; left:14px; right:14px; display:flex; gap:12px; align-items:center; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #logo { padding:8px 16px; font-weight:700; font-size:21px; letter-spacing:.3px; background:linear-gradient(90deg,#ff5d8f,#ffbe0b,#2fd9a0,#3ec7ff,#a66bff); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:0; }
  #logo { background-color:#fffafd; }
  #logo small { font-weight:400; color:var(--muted); font-size:14px; margin-left:6px; }
  #levels { display:flex; gap:8px; padding:6px; }
  #levels button { border:var(--line); border-radius:12px; background:var(--cream); padding:4px 12px; font-weight:700; font-size:15px; cursor:pointer; }
  #levels button.on { background:linear-gradient(#ffe36e,#ffbe0b); transform:translateY(-2px); box-shadow:0 3px 0 var(--ink); }
  #levels .st { color:var(--coral); font-size:13px; letter-spacing:-1px; margin-left:4px; }
  #stats { margin-left:auto; display:flex; gap:8px; }
  .chip { padding:7px 12px; font-weight:600; font-size:14px; white-space:nowrap; }
  #speed { border:var(--line); border-radius:12px; background:var(--cream); font:inherit; font-weight:600; padding:5px 8px; }

  /* builder */
  #panel { position:fixed; left:14px; top:86px; bottom:14px; width:470px; display:flex; flex-direction:column; padding:14px; }
  #brief h2 { margin:0 0 4px; font-size:21px; }
  #brief p { margin:0 0 8px; font-size:14.5px; line-height:1.35; color:#3c3760; }
  #examples { font-size:13px; background:var(--cream); border-radius:12px; padding:8px 10px; margin-bottom:10px; }
  #examples div { margin:2px 0; }
  #examples b { font-weight:600; }
  #builder { flex:1; overflow:auto; padding:2px 6px 6px 2px; }
  .node { border:var(--line); border-radius:18px; padding:10px; margin:8px 0; background:#fff; box-shadow:4px 4px 0 var(--ink); }
  .node.choice { background:#efe3ff; box-shadow:4px 4px 0 var(--plum); } .node.noul { background:#ffe3f0; box-shadow:4px 4px 0 var(--coral); } .node.score { background:#dcfaef; box-shadow:4px 4px 0 var(--teal); }
  .node .head { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .tag { font-weight:700; font-size:14px; padding:2px 10px; border-radius:10px; color:#fff; border:2px solid var(--ink); }
  .tag.choice { background:var(--plum); } .tag.noul { background:var(--rose); } .tag.score { background:var(--teal); }
  .tag small { font-weight:400; opacity:.85; }
  .node .head select { margin-left:auto; width:auto; }
  input[type=text], select { font:inherit; font-size:14px; border:2px solid var(--ink); border-radius:10px; padding:5px 8px; width:100%; color:var(--ink); background:#fff; min-width:0; }
  input[type=text]:focus, select:focus { outline:3px solid var(--butter); }
  .row { display:flex; gap:6px; align-items:center; margin:5px 0; }
  .row > .k { flex:0 0 92px; } .row > .d { flex:1; } .row > .dest { flex:0 0 132px; width:132px; font-size:12.5px; padding:5px 4px; }
  .lbl { font-size:12px; color:var(--muted); margin:6px 0 2px; }
  .mini { border:2px solid var(--ink); background:var(--cream); border-radius:9px; padding:2px 8px; cursor:pointer; font-size:13px; font-weight:600; }
  .sub { margin-left:12px; }
  input[type=range] { flex:1; accent-color:var(--coral); }
  .thlab { font-size:13px; font-weight:600; flex:0 0 82px; }
  #go { margin-top:10px; padding:13px; font-size:20px; font-weight:700; border:var(--line); border-radius:16px; cursor:pointer;
        background:linear-gradient(#ff8fb8,#ff5d8f); color:#fff; box-shadow:0 5px 0 var(--ink); transition:transform .08s; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 5px 0 var(--ink), 0 0 0 7px #ff5d8f44; } }
  #go:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #go:disabled { background:#b9b2cf; cursor:wait; }
  #err { color:#d1342f; font-size:13.5px; min-height:18px; margin-top:6px; font-weight:600; }

  /* in-world overlays */
  .bubble { position:fixed; transform:translate(-50%,-100%); padding:6px 12px; font-weight:600; font-size:15px; pointer-events:none;
            white-space:nowrap; transition:opacity .15s; }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-11px; margin-left:-8px; border:8px solid transparent; border-top-color:var(--ink); }
  #msg { position:fixed; top:84px; left:calc(50% + 250px); transform:translateX(-50%); max-width:560px; white-space:normal; font-weight:500; font-size:16px; text-align:center; padding:8px 16px; }
  #msg::after { display:none; }
  #msg b { color:var(--coral); }
  #hint { position:fixed; left:506px; bottom:24px; max-width:380px; padding:10px 14px; font-size:14.5px; display:flex; gap:10px; align-items:flex-start; }
  #hint b { color:var(--coral); }
  #ticker { position:fixed; right:14px; bottom:14px; width:400px; max-height:210px; overflow:auto; padding:8px 10px; font-size:13px; }
  #ticker:empty { display:none; }
  #log div { padding:3px 0; border-bottom:2px dotted #eadfc9; }
  .ok { color:#1f8f7f; } .ko { color:#d1342f; }
  .float { position:fixed; font-weight:700; font-size:26px; pointer-events:none; transform:translate(-50%,-50%); animation:up 1.1s ease-out forwards; text-shadow:2px 2px 0 #fff; }
  @keyframes up { to { transform:translate(-50%,-160%); opacity:0; } }

  /* end card */
  #end { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#4a2f6b66; backdrop-filter:blur(3px); }
  #end.on { display:flex; }
  #end .card { width:520px; padding:24px 26px; text-align:center; animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  #end h3 { margin:0; font-size:30px; }
  #stars { font-size:56px; letter-spacing:6px; margin:6px 0; }
  #stars span { display:inline-block; color:#d9cdb5; }
  #stars span.on { color:var(--butter); -webkit-text-stroke:2px var(--ink); animation:pop .4s backwards; }
  #endstats { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:8px 0 12px; }
  #endstats div { background:var(--cream); border-radius:12px; padding:6px 10px; font-weight:600; font-size:14px; }
  #end pre { text-align:left; box-shadow: inset 0 -18px 14px -10px #00000066; background:var(--ink); color:#f7efe0; border-radius:12px; padding:10px; font-size:11.5px; max-height:170px; overflow:auto; margin:0; }
  #end .lbl { text-align:left; }
  #end .btns { display:flex; gap:10px; margin-top:14px; }
  #end .btns button { flex:1; padding:11px; font-size:17px; font-weight:700; border:var(--line); border-radius:14px; cursor:pointer; box-shadow:0 4px 0 var(--ink); }
  #again { background:var(--cream); } #next { background:linear-gradient(#5ff0bd,#2fd9a0); color:#fff !important; }
  #nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:18px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <div id="logo" class="sticker">L'aiguilleur <small>JuL Arcade</small></div>
  <div id="levels" class="sticker"></div>
  <div id="stats">
    <div class="chip sticker" id="h-acc">— / —</div>
    <div class="chip sticker" id="h-score">Score —</div>
    <div class="chip sticker" id="h-lat">— ms / décision</div>
    <div class="chip sticker">0 token · 0 $</div>
    <div class="chip sticker" id="brain">…</div>
    <select id="speed" class="sticker"><option value="1">×1</option><option value="2" selected>×2</option><option value="4">×4</option></select>
  </div>
</div>

<section id="panel" class="sticker">
  <div id="brief"></div>
  <div id="examples"></div>
  <div class="lbl">Ta machine — chaque bloc est un vrai appel <b>system_one</b></div>
  <div id="builder"></div>
  <button id="go">▶ Lancer la vague</button>
  <div id="err"></div>
</section>

<div id="hint" class="sticker"></div>
<div id="ticker" class="sticker"><div id="log"></div></div>
<div id="msg" class="sticker" style="opacity:0"></div>
<div id="say" class="bubble sticker" style="opacity:0"></div>

<div id="end"><div class="card sticker">
  <h3 id="endtitle"></h3>
  <div id="stars"><span>★</span><span>★</span><span>★</span></div>
  <div id="endstats"></div>
  <div class="lbl">L'appel API que tu as construit (c'est du code de prod) :</div>
  <pre id="wire"></pre>
  <div class="btns"><button id="again">↺ Rejouer</button><button id="next">Niveau suivant →</button></div>
</div></div>
<div id="nogl" class="sticker">WebGL indisponible — <a href="/classic.html">version 2D</a></div>

<script>
// ---------------------------------------------------------------- state + builder (plain script: globals)
const $ = s => document.querySelector(s);
let LEVELS = [], LV = null, MACHINE = null, BUSY = false;
let BEST = JSON.parse(localStorage.getItem("jularcade.best") || "{}");
const TYPE = { choice: ["Trieur", "Choice"], noul: ["Porte oui/non", "Noul"], score: ["Jauge", "Score"] };

const blank = (type) => {
  const p = Object.keys(LV.portals);
  if (type === "choice") return { type, instructions: "", options: p.slice(0, Math.max(2, Math.min(p.length, 3))).map(k => ({ key: "", description: "", to: k })) };
  if (type === "noul") return { type, instructions: "", threshold: 0.5, yes: p[0], no: p[1] || p[0] };
  return { type, instructions: "", levels: ["", "", ""], threshold: 0.5, above: p[0], below: p[1] || p[0] };
};
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function destSelect(get, set) {
  const s = el("select", { className: "dest" });
  for (const [k, v] of Object.entries(LV.portals)) s.add(new Option(`${v.emoji} ${v.label}`, k));
  for (const t of LV.tools) s.add(new Option(`+ ${TYPE[t][0]}`, "+" + t));
  const cur = get(); s.value = typeof cur === "string" ? cur : "+" + cur.type;
  s.onchange = () => { set(s.value.startsWith("+") ? blank(s.value.slice(1)) : s.value); render(); };
  return s;
}
function input(val, ph, on) {
  const i = el("input", { type: "text", value: val || "", placeholder: ph });
  i.oninput = () => { on(i.value); changed(false); }; return i;
}
function nodeEl(node, setNode, depth) {
  const box = el("div", { className: "node " + node.type });
  const sel = el("select");
  for (const t of LV.tools) sel.add(new Option(`${TYPE[t][0]} (${TYPE[t][1]})`, t));
  sel.value = node.type; sel.onchange = () => { setNode(blank(sel.value)); render(); };
  const head = el("div", { className: "head" }, el("span", { className: "tag " + node.type, innerHTML: `${TYPE[node.type][0]} <small>${TYPE[node.type][1]}</small>` }), sel);
  if (depth > 0) { const x = el("button", { className: "mini", textContent: "✕" , title: "retirer ce bloc" });
    x.onclick = () => { setNode(Object.keys(LV.portals)[0]); render(); }; head.append(x); }
  box.append(head, input(node.instructions,
    node.type === "noul" ? "Ta question oui/non… (le client est-il … ?)" : node.type === "score" ? "Ce que tu mesures… (à quel point … ?)" : "Ta question… (optionnel)",
    v => node.instructions = v));
  const sub = el("div", { className: "sub" });
  const kid = (dest, set) => { if (typeof dest === "object") sub.append(nodeEl(dest, set, depth + 1)); };
  if (node.type === "choice") {
    sub.append(el("div", { className: "lbl", textContent: "options : nom · critère · sortie" }));
    node.options.forEach((o, i) => {
      const k = input(o.key, "nom", v => o.key = v); k.className = "k";
      const d = input(o.description, "décris ce qui va là", v => o.description = v); d.className = "d"; d.title = o.description || "";
      const r = el("div", { className: "row" }, k, d, destSelect(() => o.to, v => o.to = v));
      if (node.options.length > 2) { const x = el("button", { className: "mini", textContent: "−" }); x.onclick = () => { node.options.splice(i, 1); render(); }; r.append(x); }
      sub.append(r); kid(o.to, v => o.to = v);
    });
    const add = el("button", { className: "mini", textContent: "+ option" });
    add.onclick = () => { node.options.push({ key: "", description: "", to: Object.keys(LV.portals)[0] }); render(); }; sub.append(add);
  } else {
    if (node.type === "score") {
      sub.append(el("div", { className: "lbl", textContent: "graduations, de la plus basse à la plus haute" }));
      node.levels.forEach((l, i) => { const r = el("div", { className: "row" }, input(l, `graduation ${i + 1}`, v => node.levels[i] = v));
        if (node.levels.length > 2) { const x = el("button", { className: "mini", textContent: "−" }); x.onclick = () => { node.levels.splice(i, 1); render(); }; r.append(x); }
        sub.append(r); });
      const add = el("button", { className: "mini", textContent: "+ graduation" }); add.onclick = () => { node.levels.push(""); render(); }; sub.append(add);
    }
    const lab = el("span", { className: "thlab" });
    const rg = el("input", { type: "range", min: 0.05, max: 0.97, step: 0.01, value: node.threshold });
    const upd = () => lab.textContent = `seuil ${(Number.isFinite(+node.threshold) ? +node.threshold : 0.5).toFixed(2)}`;
    rg.oninput = () => { node.threshold = +rg.value; upd(); changed(false); }; upd();
    sub.append(el("div", { className: "row" }, lab, rg));
    const [a, b, la, lb] = node.type === "noul" ? ["yes", "no", "si oui →", "si non →"] : ["above", "below", "au-dessus →", "en dessous →"];
    for (const [key, txt] of [[a, la], [b, lb]]) {
      sub.append(el("div", { className: "row" }, el("span", { textContent: txt, style: "font-size:13px;flex:0 0 90px;font-weight:600" }), destSelect(() => node[key], v => node[key] = v)));
      kid(node[key], v => node[key] = v);
    }
  }
  box.append(sub); return box;
}
function render() { const b = $("#builder"); b.innerHTML = ""; b.append(nodeEl(MACHINE, v => MACHINE = v, 0)); changed(true); }
function changed(structural) { if (structural && window.STAGE) STAGE.buildMachines(MACHINE); }

function wireOf(n) {
  if (typeof n !== "object") return null;
  if (n.type === "choice") return { type: "choice", instructions: n.instructions, criteria: Object.fromEntries(n.options.map(o => [o.key, o.description || null])) };
  if (n.type === "noul") return { type: "noul", instructions: n.instructions };
  return { type: "score", instructions: n.instructions, criteria: n.levels };
}
function wireTree(n, out = {}, path = "q") {   // every block of the machine = one question
  if (typeof n !== "object") return out;
  out[path] = wireOf(n);
  const kids = n.type === "choice" ? n.options.map(o => o.to) : n.type === "noul" ? [n.yes, n.no] : [n.above, n.below];
  kids.forEach((k, i) => wireTree(k, out, path + "_" + (i + 1)));
  return out;
}

function levelButtons() {
  const d = $("#levels"); d.innerHTML = "";
  LEVELS.forEach((l, i) => { const s = BEST[l.id] || 0;
    const b = el("button", { className: l === LV ? "on" : "", innerHTML: `${i + 1}<span class="st">${"★".repeat(s)}${"☆".repeat(3 - s)}</span>` });
    b.onclick = () => !BUSY && pick(l); d.append(b); });
}
function pick(l) {
  LV = l; MACHINE = JSON.parse(localStorage.getItem("jularcade.m." + l.id) || "null") || structuredClone(l.starter);
  $("#brief").innerHTML = `<h2>${l.title.replace(/^Niveau \d+ · /, "")}</h2><p>${l.brief}</p>`;
  $("#examples").innerHTML = "<b>Exemples</b>" + l.examples.map(e => `<div>« ${e.text} »&nbsp;→&nbsp;${l.portals[e.portal].emoji}&nbsp;${l.portals[e.portal].label}</div>`).join("");
  $("#hint").innerHTML = `<span style="font-size:26px">🤖</span><div><b>Bip.</b> ${l.hint || ""}</div>`; $("#hint").style.display = "flex";
  $("#log").innerHTML = ""; $("#h-acc").textContent = `0 / ${l.wave_size}`; $("#h-score").textContent = "Score —";
  levelButtons(); if (window.STAGE) STAGE.setLevel(l); render();
}

function stepLabel(s) {
  if (s.type === "choice") return `${s.branch} · ${Math.round(s.confidence * 100)} %`;
  if (s.type === "noul") return `oui à ${Math.round(s.value * 100)} % → ${s.branch}`;
  return `jauge ${s.value.toFixed(2)} → ${s.branch}`;
}
function itemDone(it, i, ok) {
  $("#h-acc").textContent = `${ok} / ${i + 1} bien rangés`;
  $("#log").insertAdjacentHTML("afterbegin", `<div class="${it.ok ? "ok" : "ko"}">${it.ok ? "✓" : "✗"} « ${it.text} » → ${LV.portals[it.got].emoji} ${LV.portals[it.got].label}${it.ok ? "" : ` <b>(attendu ${LV.portals[it.expected].label})</b>`} · ${it.steps.map(stepLabel).join(" · ")}</div>`);
}
function endCard(res, snap) {
  $("#h-score").textContent = `Score ${res.score} ${"★".repeat(res.stars)}${"☆".repeat(3 - res.stars)}`;
  $("#endtitle").textContent = ["Le robot est perdu…", "Peut mieux faire", "Bien joué !", "Parfait !"][res.stars];
  [...document.querySelectorAll("#stars span")].forEach((s, i) => { s.className = i < res.stars ? "on" : ""; s.style.animationDelay = (0.15 + i * 0.2) + "s"; });
  $("#endstats").innerHTML = `<div>${res.correct} / ${res.total} bien rangés</div><div>score ${res.score}</div><div>${res.calls} appels JuL</div><div>${res.ms_per_call} ms / décision</div><div>0 token · 0 $</div>`;
  $("#wire").textContent = `POST /v1/systemone\n` + JSON.stringify({ state: "<le message du client>", questions: wireTree(snap) }, null, 2);
  const idx = LEVELS.indexOf(LV); $("#next").style.display = idx < LEVELS.length - 1 ? "" : "none";
  $("#end").classList.add("on");
  if ((BEST[LV.id] || 0) < res.stars) { BEST[LV.id] = res.stars; localStorage.setItem("jularcade.best", JSON.stringify(BEST)); levelButtons(); }
}
$("#again").onclick = () => $("#end").classList.remove("on");
$("#next").onclick = () => { $("#end").classList.remove("on"); pick(LEVELS[LEVELS.indexOf(LV) + 1]); };

$("#go").onclick = async () => {
  $("#err").textContent = ""; $("#go").disabled = true; BUSY = true; $("#hint").style.display = "none";
  localStorage.setItem("jularcade.m." + LV.id, JSON.stringify(MACHINE));
  const snap = structuredClone(MACHINE);
  try {
    const r = await fetch("/api/play", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ level: LV.id, machine: snap }) });
    const res = await r.json();
    if (!r.ok) { $("#err").textContent = "⚠ " + res.error; STAGE.say("Bzzt… " + res.error); return; }
    $("#h-lat").textContent = `${res.ms_per_call} ms / décision`;
    window.LAST = res; $("#log").innerHTML = "";
    await STAGE.runWave(res, snap);
    endCard(res, snap);
  } catch (e) { $("#err").textContent = "⚠ " + e; }
  finally { $("#go").disabled = false; BUSY = false; }
};

function boot() {
  fetch("/api/warmup").catch(() => {});   // wake the model functions while the player reads the brief
  fetch("/api/levels").then(r => r.json()).then(d => { LEVELS = d.levels; $("#brain").textContent = d.brain.replace(" (local)", ""); pick(LEVELS[0]); });
}
window.addEventListener("stage-ready", boot);
</script>

<script type="module">
// ---------------------------------------------------------------- the 3D island (three.js, orthographic iso)
import * as THREE from "/vendor/three.module.min.js";

const canvas = document.getElementById("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { document.getElementById("nogl").style.display = "flex"; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const LOOK = new THREE.Vector3(1.5, 0, 0.5);
cam.position.set(LOOK.x + 22, 20, LOOK.z + 22); cam.lookAt(LOOK);
function resize() {
  const w = innerWidth, h = innerHeight, zoom = 12.5 * Math.max(1, 1500 / w);
  renderer.setSize(w, h, false);
  // shift the island right, away from the builder panel
  const a = w / h, ox = -zoom * a * 0.30;
  Object.assign(cam, { left: -zoom * a + ox, right: zoom * a + ox, top: zoom * 0.85, bottom: -zoom * 1.15 }); cam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

scene.add(new THREE.HemisphereLight("#fff4fb", "#c9a8ff", 1.8));
const sun = new THREE.DirectionalLight("#fff3f8", 2.0); sun.position.set(-10, 24, 12); sun.castShadow = true;

      needle.geometry.translate(0, 0.25, 0); g.userData.needle = needle; }
    if (node.type !== "score") kawaiiFace(g, { y: 1.25, z: node.type === "noul" ? 0.95 : 1.0, scale: 0.75 });
    const bulb = mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshBasicMaterial({ color: "#fff3c4" }), { y: 2.3, parent: g });
    const lb = label(TYPE[node.type][0], { size: 34, bg: MCOL[node.type], color: "#fff" }); lb.position.set(0, 3.7, 0); g.add(lb);
    g.userData.bulb = bulb; g.userData.body = body;

    const sub = kids.filter(k => typeof k === "object");

async function runWave(res, snap) {
  buildMachines(snap); let ok = 0;
  say.style.opacity = 0;
  for (const [i, it] of res.items.entries()) {
    const p = parcel(); p.position.set(BELT.x0 + 0.5, 0.5, BELT.z);
    msg.innerHTML = `<b>${i + 1}/${res.total}</b> « ${it.text} »`; msg.style.opacity = 1;
    await moveTo(p, new THREE.Vector3(BELT.x1 - 0.6, 0.5, BELT.z), 650);
    const nodes = nodePath(snap, it.steps);
    for (const [j, s] of it.steps.entries()) {
      const g = machineMeshes.get(nodes[j]); if (!g) continue;
      sayAt.position.copy(g.position);
      const rp = new THREE.Vector3(g.position.x + 2.6, 0, g.position.z - 1.4);
      robot.lookAt(g.position.x, 0, g.position.z);
      await Promise.all([moveTo(p, new THREE.Vector3(g.position.x, 0.5, g.position.z - 1.7), 380, 0.8),
                         robot.position.distanceTo(rp) > 0.1 ? moveTo(robot, rp, 380, 0.6) : null]);
      const unsure = s.confidence < 0.35;
      setMood(unsure ? "unsure" : "idle");
      g.userData.bulb.material.color.set(unsure ? "#ffd166" : "#9ff0de");
      if (g.userData.needle) { const target = (0.5 - s.value) * Math.PI * 1.4; const r0 = g.userData.needle.rotation.z;
        tween(400, e => g.userData.needle.rotation.z = r0 + (target - r0) * e); }
      say.textContent = stepLabel(s); say.style.opacity = 1;
      await tween(unsure ? 950 : 480, (e, k) => g.userData.body.scale.setScalar(1 + Math.sin(k * Math.PI * (unsure ? 6 : 2)) * 0.06));
      g.userData.bulb.material.color.set("#fff3c4");
    }
    say.style.opacity = 0;
    const P = portals[it.got];
    await moveTo(p, new THREE.Vector3(P.pos.x, 0.3, P.pos.z), 620, 2.6);
    if (it.ok) { ok++; setMood("happy"); burst(P.pos, LV.portals[it.got].color); floatText(new THREE.Vector3(P.pos.x, 3, P.pos.z), "+1", "#1f8f7f");
      P.glow.material.opacity = 0.9; }
    else { setMood("sad"); floatText(new THREE.Vector3(P.pos.x, 3, P.pos.z), `✗ c'était ${LV.portals[it.expected].emoji}`, "#d1342f");
      const x0 = P.g.position.x; await tween(380, (e, k) => P.g.position.x = x0 + Math.sin(k * 30) * 0.18 * (1 - k)); }
    msg.style.opacity = 0;
    await tween(260, e => p.scale.setScalar(1 - e));
    scene.remove(p); P.glow.material.opacity = 0.35;
    itemDone(it, i, ok);
  }
  setMood(res.stars >= 2 ? "happy" : res.stars ? "idle" : "sad"); sayAt.position.copy(robot.position); sayAt.position.y -= 1;
  say.textContent = ["Bzzt… on recommence ?", "Hmm, presque.", "Youpi !", "PARFAIT !!"][res.stars]; say.style.opacity = 1;
  await wait(700);
}

// main loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  slats.forEach((s, i) => { const L = BELT.x1 - BELT.x0; s.position.x = BELT.x0 + ((i / slats.length) * L + t * 1.6 * speed()) % L; });
  clouds.forEach((c, i) => { c.position.x += dt * 0.35; if (c.position.x > 20) c.position.x = -22; });
  hearts.forEach(h => { h.position.y += Math.sin(t * 1.5 + h.userData.p) * 0.004; h.rotation.y = Math.sin(t + h.userData.p) * 0.6; });
  for (const k in portals) { const st = portals[k].arch.userData.star; if (st) { st.rotation.y = t * 2; st.position.y = 2.9 + Math.sin(t * 3 + k.length) * 0.12; } }
  const since = (performance.now() - moodT) / 1000;
  robot.position.y = mood === "happy" ? Math.abs(Math.sin(since * 7)) * 0.5 * Math.max(0, 1 - since / 1.6) : Math.sin(t * 2.2) * 0.06;
  head.rotation.z = mood === "unsure" ? Math.sin(t * 9) * 0.18 : mood === "sad" ? 0.22 : 0;
  head.rotation.x = mood === "sad" ? 0.25 : 0;
  antenna.material.color.set(mood === "unsure" ? "#ffd166" : mood === "sad" ? "#8c88a8" : "#ff6f59");
  for (const m of confetti) { m.userData.t += dt; m.userData.v.y -= 14 * dt; m.position.addScaledVector(m.userData.v, dt); m.rotation.x += dt * 8; m.rotation.y += dt * 6;
    if (m.userData.t > 1.6) { scene.remove(m); m.userData.dead = true; } }
  for (let i = confetti.length - 1; i >= 0; i--) if (confetti[i].userData.dead) confetti.splice(i, 1);
  for (const a of anchors) { const v = a.obj.getWorldPosition(new THREE.Vector3()); v.y += a.dy; const [x, y] = project(v); a.elm.style.left = x + "px"; a.elm.style.top = y + "px"; }
  renderer.render(scene, cam);
});

window.STAGE = {
  setLevel(lv) { buildPortals(lv); setMood("idle"); say.style.opacity = 0; },
  buildMachines, runWave,
  say(t) { setMood("sad"); say.textContent = t.length > 60 ? t.slice(0, 58) + "…" : t; say.style.opacity = 1; setTimeout(() => say.style.opacity = 0, 3500); },
};
document.fonts.load("600 20px Fredoka").finally(() => window.dispatchEvent(new Event("stage-ready")));
</script>
</body>
